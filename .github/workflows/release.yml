name: Publish packages

on:
  push:
    tags:
      - "release/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "需要重试的发布标签，例如 release/v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pack.outputs.packages }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check release tag and notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(node -p 'require("./packages/core/package.json").version')" = "${RELEASE_TAG#release/v}"
          test -f "releases/v${RELEASE_TAG#release/v}.md"
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:apis
      - name: Check generated API lists are committed
        run: |
          git status --short -- packages
          test -z "$(git status --porcelain -- packages)"
      - run: pnpm test:release
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:build
      - name: Pack release tarballs
        id: pack
        run: node scripts/pack-release.mjs "$RUNNER_TEMP/slux-release-tarballs"
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/slux-release-tarballs/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm with trusted publishing
        run: npm install -g npm@11.20.0
      - name: Publish package through trusted publishing
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-publish.mjs release-tarballs "@slux/${PACKAGE}" "$VERSION"

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs
      - name: Verify release assets
        working-directory: release-tarballs
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release with package assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "releases/v${VERSION}.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "v${VERSION}" --notes-file "releases/v${VERSION}.md"
          fi
          gh release upload "$RELEASE_TAG" release-tarballs/*.tgz release-tarballs/SHA256SUMS release-tarballs/release-manifest.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --title "v${VERSION}"
